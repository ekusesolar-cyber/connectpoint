version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: connectpoint-db
    environment:
      POSTGRES_DB: connectpoint
      POSTGRES_USER: connectpoint
      POSTGRES_PASSWORD: ${DB_PASSWORD:-connectpoint_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectpoint"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: connectpoint-backend
    environment:
      DATABASE_URL: postgresql://connectpoint:${DB_PASSWORD:-connectpoint_secret}@postgres:5432/connectpoint
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FLUTTERWAVE_PUBLIC_KEY: ${FLUTTERWAVE_PUBLIC_KEY}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY}
      FLUTTERWAVE_ENCRYPTION_KEY: ${FLUTTERWAVE_ENCRYPTION_KEY}
      FLUTTERWAVE_WEBHOOK_SECRET: ${FLUTTERWAVE_WEBHOOK_SECRET}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      NODE_ENV: production
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: connectpoint-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  freeradius:
    image: freeradius/freeradius-server:3.2-alpine
    container_name: connectpoint-radius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./apps/backend/radius:/etc/raddb:ro
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: connectpoint
      DB_USER: connectpoint
      DB_PASS: ${DB_PASSWORD:-connectpoint_secret}
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
