# ConnectPoint FreeRADIUS clients configuration
# Each MikroTik router must be added here or managed via the `nas` table

client localhost {
  ipaddr = 127.0.0.1
  secret = testing123
  require_message_authenticator = no
  nas_type = other
}

client mikrotik-router {
  ipaddr = 0.0.0.0/0
  secret = testing123
  shortname = MikroTik
  nas_type = mikrotik
}
